<body>

  <header>

    <div class="header-conteudo">

      <h1>Cadastro</h1>
      <button type="button" id="botao-contraste" class="botao-contraste" aria-pressed="false"
        aria-label="Ativar modo de alto contraste">
        
      </button>

      <input type="checkbox" id="menu-controle" class="menu-controle">

      <label for="menu-controle" class="menu-hamburguer" aria-label="Abrir menu de navegação">
        ☰
      </label>

      <nav class="menu" aria-label="Navegação principal">

        <ul class="menu-lista">

            <a href="index.html">
              Início

          <li class="tem-submenu">

              Projetos ▾

            <ul class="submenu">

              <li>
                <a href="projetos.html#doacao">
                  Doações
                </a>
              </li>

              <li>
                <a href="projetos.html#voluntariado">
                  Voluntariado
                </a>
              </li>

            </ul>

          </li>

          <li>
            <a href="cadastro.html">
              Cadastro
            </a>
          </li>

        </ul>

      </nav>

    </div>

  </header>


  <main>

    <form id="form-cadastro" action="#" method="post" novalidate>

      <!-- DADOS PESSOAIS -->

      <fieldset>

        <legend>Dados pessoais</legend>


        <div class="campo-formulario">

          <label for="nome">
            Nome completo:
          </label>

          <input type="text" id="nome" name="nome" required minlength="3" autocomplete="name">

        </div>


        <div class="campo-formulario">

          <label for="email">
            E-mail:
          </label>

          <input type="email" id="email" name="email" required autocomplete="email">

        </div>


        <div class="campo-formulario">

          <label for="nascimento">
            Data de nascimento:
          </label>

          <input type="date" id="nascimento" name="nascimento" required>
          <small id="idade-calculada" class="idade-calculada" aria-live="polite"></small>

        </div>


        <div class="campo-formulario">

          <label for="cpf">
            CPF:
          </label>

          <input type="text" id="cpf" name="cpf" required inputmode="numeric"
            pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}" placeholder="000.000.000-00"
            title="Digite o CPF no formato 000.000.000-00">

        </div>


        <div class="campo-formulario">

          <label for="telefone">
            Telefone:
          </label>

          <input type="tel" id="telefone" name="telefone" required pattern="\([0-9]{2}\) [0-9]{5}-[0-9]{4}"
            placeholder="(00) 00000-0000" title="Digite o telefone no formato (00) 00000-0000" autocomplete="tel">

        </div>

      </fieldset>


      <!-- ENDEREÇO -->

      <fieldset>

        <legend>Endereço</legend>


        <div class="campo-formulario">

          <label for="endereco">
            Endereço:
          </label>

          <input type="text" id="endereco" name="endereco" required>

        </div>


        <div class="campo-formulario">

          <label for="cidade">
            Cidade:
          </label>

          <input type="text" id="cidade" name="cidade" required>

        </div>


        <div class="campo-formulario">

          <label for="estado">
            Estado:
          </label>

          <select id="estado" name="estado" required>

            <option value="">
              Selecione
            </option>

            <option value="SP">
              São Paulo
            </option>

            <option value="RJ">
              Rio de Janeiro
            </option>

            <option value="MG">
              Minas Gerais
            </option>

            <option value="PR">
              Paraná
            </option>

            <option value="SC">
              Santa Catarina
            </option>

          </select>

        </div>


        <div class="campo-formulario">

          <label for="cep">
            CEP:
          </label>

          <input type="text" id="cep" name="cep" required inputmode="numeric" pattern="[0-9]{5}-[0-9]{3}"
            placeholder="00000-000" title="Digite o CEP no formato 00000-000" autocomplete="postal-code">

        </div>

      </fieldset>


      <!-- MENSAGEM DE FEEDBACK -->

      <div id="mensagem-formulario" class="mensagem-formulario" role="status" aria-live="polite"></div>


      <button type="submit">
        Enviar cadastro
      </button>

    </form>

  </main>
